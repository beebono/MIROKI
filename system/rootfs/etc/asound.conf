# MIROKI ALSA configuration
#
# The sprdphone-sc2730 has no usable hardware volume control (the HP "Gain"
# controls are attenuators), so volume is a softvol plugin. Its
# "MIROKI Playback Volume" user control on card 0 appears the first time the
# default PCM is opened.
#
# The AGDSP/VBC path runs at 48 kHz mono (one speaker; VBC_MIXER0_DAC0
# HALF_ADD downmix). The plug layers pin the slave to 48k/1ch, so stereo
# 44.1 kHz core output is averaged down and resampled instead of playing an
# octave low (stereo frames read as mono run at half speed).

pcm.!default {
    type plug
    slave.pcm "miroki_softvol"
}

pcm.miroki_softvol {
    type softvol
    slave.pcm "miroki_hw48"
    control {
        name "MIROKI Playback Volume"
        card 0
    }
    min_dB -45.0
    max_dB 0.0
    resolution 16
}

pcm.miroki_hw48 {
    type plug
    slave {
        pcm "hw:0,0"
        rate 48000
        format S16_LE
        channels 1
    }
}

ctl.!default {
    type hw
    card 0
}
