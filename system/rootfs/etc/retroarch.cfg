# MIROKI defaults. RetroArch uses this file as the skeleton for a new
# /data/.config/retroarch/retroarch.cfg, so it only applies while that file
# does not exist yet.
video_driver = "gl"
audio_driver = "alsa"
# No ALSA sequencer in the kernel
midi_driver = "null"
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/retroarch/autoconfig"
menu_driver = "ramen"

# Cores live in the rootfs; everything mutable lives on data.
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
system_directory = "/data/bios"
rgui_browser_directory = "/data/roms"
playlist_directory = "/data/playlists"
savefile_directory = "/data/saves"
savestate_directory = "/data/states"
screenshot_directory = "/data/screenshots"
thumbnails_directory = "/data/thumbnails"
