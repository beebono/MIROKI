# MIROKI defaults. RetroArch uses this file as the skeleton for a new
# /data/.config/retroarch/retroarch.cfg, so it only applies while that file
# does not exist yet.
video_driver = "gl"
audio_driver = "alsa"
# No ALSA sequencer in the kernel
midi_driver = "null"
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/retroarch/autoconfig"
menu_driver = "ramen"

# Cores live in the rootfs; everything mutable lives on data.
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
system_directory = "/data/bios"
rgui_browser_directory = "/data/roms"
playlist_directory = "/data/playlists"
savefile_directory = "/data/saves"
savestate_directory = "/data/states"
screenshot_directory = "/data/screenshots"
thumbnails_directory = "/data/thumbnails"
# Play time and last-played dates, shown on ramen's monitor.
content_runtime_log = "true"
runtime_log_directory = "/data/playlists/logs"

# ramen's cues go through the audio mixer, which only runs in the menu
# with this on. The stock menu sounds stay off (no assets shipped).
audio_enable_menu = "true"

# On-screen messages in MIROKI's face: the menu font, pale green on a
# dark green plate, bottom left.
video_font_path = "/usr/share/miroki/fonts/Audiowide-Regular.ttf"
video_font_size = "22"
video_message_pos_x = "0.04"
video_message_pos_y = "0.05"
video_message_color = "b4e6c3"
video_msg_bgcolor_enable = "true"
video_msg_bgcolor_red = "8"
video_msg_bgcolor_green = "30"
video_msg_bgcolor_blue = "18"
video_msg_bgcolor_opacity = "0.75"
