# miroki-inputd's virtual pad (system/aggregator). The udev joypad driver
# numbers buttons in keycode order: BTN_SOUTH 0 ... BTN_THUMBR 11, then the
# dpad. Face buttons follow the RetroPad by position (B bottom, A right).
# AUX (BTN_THUMBR) opens the menu. Mode is Hotkey Enable, but that bind
# lives in etc/retroarch.cfg: with enable_hotkey set here, RetroArch would
# only take the menu toggle with Mode held.
input_driver = "udev"
input_device = "MIROKI Gamepad"
input_vendor_id = "19785"
input_product_id = "21071"

input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_menu_toggle_btn = "11"
input_up_btn = "12"
input_down_btn = "13"
input_left_btn = "14"
input_right_btn = "15"

input_b_btn_label = "A"
input_a_btn_label = "B"
input_x_btn_label = "X"
input_y_btn_label = "Y"
input_menu_toggle_btn_label = "AUX"
